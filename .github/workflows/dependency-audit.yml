name: Dependency audit

on:
  pull_request:
    paths:
      - .github/workflows/dependency-audit.yml
      - Cargo.lock
      - Cargo.toml
  push:
    branches:
      - main
    paths:
      - .github/workflows/dependency-audit.yml
      - Cargo.lock
      - Cargo.toml
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rustsec:
    name: RustSec advisory audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install project Rust toolchain
        shell: bash
        run: |
          rust_version="$(awk -F'"' '/^rust-version = "/ { print $2; exit }' Cargo.toml)"
          if [[ ! "$rust_version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Invalid or missing package.rust-version in Cargo.toml" >&2
            exit 1
          fi
          rustup toolchain install "$rust_version" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$rust_version" >> "$GITHUB_ENV"

      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Audit locked Rust dependencies
        run: cargo audit
