[package]
name = "lfs-cloud"
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false
description = "Git LFS-compatible server and CLI for routing LFS objects to user-controlled storage."

[dependencies]
anyhow = "1.0.102"
axum = "0.8.9"
base64 = "0.22.1"
clap = { version = "4.6.1", features = ["derive"] }
config = { version = "0.15.23", default-features = false, features = ["yaml"] }
dunce = "1.0.5"
fs4 = "1.1.0"
futures-util = "0.3.31"
oauth2 = { version = "5.0.0", default-features = false }
reqwest = { version = "0.13.3", default-features = false, features = ["rustls", "json", "stream"] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["fs", "io-util", "macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tokio-util = { version = "0.7.18", features = ["io"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url = "2.5.8"

[dev-dependencies]
toml = "1.1.2"
tower = { version = "0.5.2", features = ["util"] }
