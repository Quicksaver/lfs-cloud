[package]
name = "lfscloud"
version = "0.2.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false
description = "Git LFS-compatible server and CLI for routing LFS objects to user-controlled storage."

[[bin]]
name = "lfscloud"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
axum = "0.8.9"
base64 = "0.22.1"
clap = { version = "4.6.1", features = ["derive"] }
config = { version = "0.15.23", default-features = false, features = ["yaml"] }
dunce = "1.0.5"
fs4 = "1.1.0"
futures-util = "0.3.31"
keyring = "4.1.6"
reqwest = { version = "0.13.3", default-features = false, features = ["rustls", "json", "stream"] }
ring = "0.17.14"
rusqlite = { version = "0.39.0", features = ["bundled"] }
rustix = { version = "1.1.4", features = ["fs", "process"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
tempfile = "3.27.0"
terminal-prompt = "0.2.3"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "net", "signal", "sync", "time"] }
tokio-util = { version = "0.7.18", features = ["io"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url = "2.5.8"
yaml-rust2 = "0.11.0"
zeroize = "1.8.2"

[dev-dependencies]
proptest = "1.11.0"
toml = "1.1.2"
tower = { version = "0.5.2", features = ["util"] }
