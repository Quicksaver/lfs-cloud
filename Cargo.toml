[package]
name = "lfs-cloud"
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false
description = "Git LFS-compatible server and CLI for routing LFS objects to user-controlled storage."

[dependencies]
anyhow = "1.0.102"
axum = "0.8.9"
clap = { version = "4.6.1", features = ["derive"] }
config = { version = "0.15.23", default-features = false, features = ["yaml"] }
oauth2 = { version = "5.0.0", default-features = false }
reqwest = { version = "0.13.3", default-features = false, features = ["rustls", "json", "stream"] }
rusqlite = "0.39.0"
serde = { version = "1.0.228", features = ["derive"] }
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[dev-dependencies]
toml = "1.1.2"

